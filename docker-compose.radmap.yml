# Radmap - Offline NSW topographic map PWA
# Static nginx image published from https://github.com/josephradford/radmap to
# ghcr.io/josephradford/radmap (app shell + nginx config only).
# The ~950 MB .tiles archives are NOT in the image; they live on the server in
# ./data/radmap/tiles (generated with that repo's tools/download-tiles.mjs).

services:
  radmap:
    # Pinned by digest (the repo publishes no version tags). Image built 2026-10-03.
    # To update: docker pull ghcr.io/josephradford/radmap:latest, then replace the
    # digest below with `docker image inspect ... --format '{{index .RepoDigests 0}}'`.
    image: ghcr.io/josephradford/radmap:latest@sha256:b333e277716cd1f36abe29fb6b0361beab332a37d5586cf9d2e181d5998a6f82
    container_name: radmap
    restart: unless-stopped
    volumes:
      - ./data/radmap/tiles:/usr/share/nginx/html/tiles:ro
    networks:
      - homeserver
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radmap.rule=Host(`radmap.${DOMAIN}`)"
      - "traefik.http.routers.radmap.entrypoints=websecure"
      - "traefik.http.routers.radmap.tls=true"
      - "traefik.http.services.radmap.loadbalancer.server.port=80"
      - "traefik.http.routers.radmap.middlewares=internal-only,security-headers"

networks:
  homeserver:
    external: true
    name: home-server-stack_homeserver
