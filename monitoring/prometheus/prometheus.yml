global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'blackbox-icmp'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - '192.168.1.1'        # router — update if your gateway IP differs
          - '1.1.1.1'            # ISP/internet health
          - '8.8.8.8'            # ISP/internet health (secondary)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # DNS health: ask AdGuard (target = the DNS server to query) to resolve a real
  # name. Container-level checks can't tell "running" from "answering DNS".
  - job_name: 'blackbox-dns'
    # 30s (not the 15s global default) to halve the example.com query noise in
    # AdGuard's log/stats; AdGuardDNSFailing still needs 2m of failures to fire.
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [dns_a]
    static_configs:
      - targets:
          - 'adguard:53'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  # odd-jobs: daily fixture-calendar refresh. Exposes last-success time and last-run
  # status per job; the OddJobsStale alert fires when refreshes stop succeeding.
  - job_name: 'odd-jobs'
    scrape_interval: 60s
    metrics_path: /metrics
    static_configs:
      - targets: ['odd-jobs:8080']
