modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: "ip4"

  # Real DNS lookup against a resolver: probe_success=1 only if it answers
  # the query with NOERROR. Used to verify AdGuard is actually serving DNS.
  dns_a:
    prober: dns
    timeout: 5s
    dns:
      query_name: "example.com"
      query_type: "A"
      preferred_ip_protocol: "ip4"
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - "example.com.\\t.*\\tIN\\tA\\t.*"

  # DNS lookup of a domain AdGuard blocks: probe_success=1 only if the answer is
  # 0.0.0.0 (AdGuard's default blocking response). If protection is off or the
  # filter list no longer covers the domain, it resolves to a real address and
  # the probe fails. Used for the ad-blocking indicator and AdGuardBlockingOff.
  dns_blocked:
    prober: dns
    timeout: 5s
    dns:
      query_name: "doubleclick.net"
      query_type: "A"
      preferred_ip_protocol: "ip4"
      valid_rcodes:
        - NOERROR
      validate_answer_rrs:
        fail_if_not_matches_regexp:
          - "doubleclick\\.net\\.\\t.*\\tIN\\tA\\t0\\.0\\.0\\.0"
