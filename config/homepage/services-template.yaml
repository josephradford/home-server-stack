---
# Life - calendar, weather, etc
- Today:
    - BOM Weather:
        icon: mdi-weather-partly-cloudy
        href: http://www.bom.gov.au/
        description: Australian weather forecast
        widget:
          type: customapi
          url: http://homepage-api:5000/api/bom/weather
          refreshInterval: 300000  # 5 minutes
          display: list
          mappings:
            - field: observations.temp
              label: Temperature
              suffix: "°C"
            - field: observations.temp_feels_like
              label: Feels Like
              suffix: "°C"
            - field: observations.humidity
              label: Humidity
              suffix: "%"
            - field: forecast_daily.0.short_text
              label: Today

    - Google Calendar:
        icon: google-calendar.png
        href: https://calendar.google.com
        description: Upcoming events
        widget:
          type: calendar
          view: agenda
          showTime: true
          integrations:
            - type: ical
              url: {{HOMEPAGE_VAR_GCAL_ICAL_URL}}
              name: Personal Calendar
              color: blue
              maxEvents: 5

    - Bus:
        icon: mdi-bus
        siteMonitor: http://homepage-api:5000/api/transport/live/1
        widget:
          type: customapi
          url: http://homepage-api:5000/api/transport/commute/1
          refreshInterval: 60000
          display: list
          mappings:
            - field: direction
              label: Direction
            - field: departures.0.line
              label: Next
            - field: departures.0.time
              label: Departs
              format: relativeDate
            - field: departures.1.line
              label: Following
            - field: departures.1.time
              label: Departs
              format: relativeDate

    - Tram:
        icon: mdi-tram
        siteMonitor: http://homepage-api:5000/api/transport/live/2
        widget:
          type: customapi
          url: http://homepage-api:5000/api/transport/commute/2
          refreshInterval: 60000
          display: list
          mappings:
            - field: direction
              label: Direction
            - field: departures.0.line
              label: Next
            - field: departures.0.time
              label: Departs
              format: relativeDate
            - field: departures.1.line
              label: Following
            - field: departures.1.time
              label: Departs
              format: relativeDate

# Internet - network health, devices, and external provider status
- Internet:
  - Network:
      - Devices Online:
          icon: mdi-devices
          href: https://adguard.{{HOMEPAGE_VAR_DOMAIN}}/#logs
          description: Devices making DNS queries in the last 30 min (AdGuard query log)
          widget:
            type: customapi
            url: http://homepage-api:5000/api/network/devices
            refreshInterval: 60000  # 1 minute
            mappings:
              - field: count
                label: Devices (30 min)
              - field: top_devices.0.name
                label: Top
              - field: top_devices.0.queries
                label: Queries
              - field: top_devices.1.name
                label: Next
              - field: top_devices.1.queries
                label: Queries
              - field: protection_enabled
                label: Protection

      - Network Health:
          icon: mdi-wan
          href: https://prometheus.{{HOMEPAGE_VAR_DOMAIN}}/graph?g0.expr=probe_icmp_duration_seconds%7Bjob%3D%22blackbox-icmp%22%7D&g0.tab=0
          description: Local router + ISP latency and packet loss (Prometheus)
          widget:
            type: customapi
            url: http://homepage-api:5000/api/network/health
            refreshInterval: 60000  # 1 minute
            mappings:
              - field: probes.router.latency_ms
                label: Router
                suffix: "ms"
              - field: probes.router.packet_loss_pct_24h
                label: Loss (24h)
                suffix: "%"
              - field: probes.isp.latency_ms
                label: ISP
                suffix: "ms"
              - field: probes.isp.packet_loss_pct_24h
                label: Loss (24h)
                suffix: "%"

