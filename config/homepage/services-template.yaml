          container: alertmanager
          server: my-docker
          showStats: true

      - Node Exporter:
          icon: mdi-server
          description: System metrics exporter
          container: node-exporter
          server: my-docker
          showStats: true

      - cAdvisor:
          icon: mdi-docker
          description: Container metrics exporter
          container: cadvisor
          server: my-docker
          showStats: true

      - Blackbox Exporter:
          icon: mdi-radar
