# Network & Security - Infrastructure services for routing, VPN, and security
- Network & Security:
  - Traefik:
      icon: traefik.png
      href: https://traefik.{{HOMEPAGE_VAR_DOMAIN}}
      description: Reverse proxy management
      widget:
        type: traefik
        url: http://traefik:8080
      container: traefik
      server: my-docker
      showStats: true

  - Wireguard VPN:
      icon: wireguard.png
      description: VPN server (system service)
      widget:
        type: customapi
        url: http://homepage-api:5000/api/wireguard/status
        refreshInterval: 30000  # 30 seconds
        mappings:
          - field: status
            label: Status
          - field: interface
            label: Interface

  - Fail2ban:
      icon: mdi-shield-lock
      description: Intrusion prevention system
      container: fail2ban
      server: my-docker
      showStats: true

  - Docker Daemon:
      icon: mdi-docker
      description: Container runtime (system service)
      widget:
        type: customapi
        url: http://homepage-api:5000/api/docker/status
        refreshInterval: 30000  # 30 seconds
        mappings:
          - field: status
            label: Status
          - field: containers
            label: Containers
          - field: version
            label: Version
          - field: disk_usage
            label: Disk Usage


- Services:
  - Core Services:
      - AdGuard Home:
          icon: adguard-home.png
          href: https://adguard.{{HOMEPAGE_VAR_DOMAIN}}
          description: Network-wide ad blocking
          widget:
            type: adguard
            url: http://adguard-home
            username: {{HOMEPAGE_VAR_ADGUARD_USER}}
            password: {{HOMEPAGE_VAR_ADGUARD_PASS}}
          container: adguard-home
          server: my-docker
          showStats: true

  # Monitoring Stack - Metrics collection and visualization
  - Monitoring:
      - Prometheus:
          icon: prometheus.png
          href: https://prometheus.{{HOMEPAGE_VAR_DOMAIN}}
          description: Metrics & alerting
          widget:
            type: prometheus
            url: http://prometheus:9090
          container: prometheus
          server: my-docker
          showStats: true

      - Grafana:
          icon: grafana.png
          href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}
          description: Monitoring dashboards
          widget:
            type: grafana
            url: http://grafana:3000
            username: {{HOMEPAGE_VAR_GRAFANA_USER}}
            password: {{HOMEPAGE_VAR_GRAFANA_PASS}}
          container: grafana
          server: my-docker
          showStats: true

      - Alertmanager:
          icon: alertmanager.png
          href: https://alerts.{{HOMEPAGE_VAR_DOMAIN}}
          description: Alert management
          container: alertmanager
          server: my-docker
          showStats: true

      - Node Exporter:
          icon: mdi-server
          description: System metrics exporter
          container: node-exporter
          server: my-docker
          showStats: true

      - cAdvisor:
          icon: mdi-docker
          description: Container metrics exporter
          container: cadvisor
          server: my-docker
          showStats: true

  # Dashboard Services - Homepage dashboard and backend
  - Dashboard:
      - Homepage API:
          icon: mdi-api
          description: Backend API for custom widgets
          container: homepage-api
          server: my-docker
          showStats: true

  # Media - Photo and media viewers
  - Media:
      - Immich:
          icon: mdi-image-multiple
          href: https://immich.{{HOMEPAGE_VAR_DOMAIN}}
          description: Photo library viewer
          container: immich-server
          server: my-docker
          showStats: true

      - Ebook Library:
          icon: mdi-bookshelf
          href: https://books.{{HOMEPAGE_VAR_DOMAIN}}
          description: Calibre-Web-Automated + Kobo sync
          container: cwa
          server: my-docker
          showStats: true

      - Kitchen Kiosk:
          icon: mdi-tablet-dashboard
          href: https://kiosk.{{HOMEPAGE_VAR_DOMAIN}}
          description: Kitchen photo screensaver + radio/calendar/recipes
          container: kiosk-web
          server: my-docker
          showStats: true

      - Kitchen Kiosk API:
          icon: mdi-tablet-dashboard
          href: https://kiosk-api.{{HOMEPAGE_VAR_DOMAIN}}
          description: Kitchen kiosk backend (weather, calendar, photos, recipes, radio)
          container: kiosk-api
          server: my-docker
          showStats: true

  - Backups:
        - "{{HOMEPAGE_VAR_ICLOUD_LABEL}}":
            icon: mdi-cloud-download
            href: https://icloud.{{HOMEPAGE_VAR_DOMAIN}}
            description: iCloud photo backup
            container: icloudpd
            server: my-docker
            showStats: true
            widget:
              type: customapi
              url: http://homepage-api:5000/api/icloudpd/status
              refreshInterval: 60000
              mappings:
                - field: statusLabel
                  label: Status
                - field: lastSyncRelative
                  label: Last sync
                - field: message
                  label: Detail

  # Location Services - Location tracking
  - Location:
      - OwnTracks:
          icon: mdi-map-marker
          href: https://owntracks.{{HOMEPAGE_VAR_DOMAIN}}
          description: Location tracking recorder
          container: owntracks-recorder
          server: my-docker
          showStats: true

      - Radmap:
          icon: mdi-map-outline
          href: https://radmap.{{HOMEPAGE_VAR_DOMAIN}}
          description: Offline NSW topo map PWA (tile archives served to the phone)
          container: radmap
          server: my-docker
          showStats: true
