timezone: Australia/Sydney

# One entry per subscribable calendar; `name` becomes /<name>.ics.
#   cricket_com_au: `discover: true` + `team_id` (the site's numeric id for `team`) asks the site's
#                   own competitions API which series that team plays this year and next, so
#                   new tours and unlisted series (India Tests, the Ashes) are picked up.
#                   `series` pins ids (CA:<id> in https://www.cricket.com.au/matches/series/
#                   CA:<id>/...) for anything the API doesn't return; they change every season. `game_types` optionally keeps only those formats (e.g. Test).
#   playhq:         team_id is the last segment of the team's page URL on playhq.com
calendars:
  - name: australia-tests
    title: Australia Men's Tests
    source: cricket_com_au
    discover: true   # asks the site which series Australia Men are in (this year and next)
    team_id: 23      # cricket.com.au team id for "Australia Men" (homeTeam.id in any series page)
    game_types: ["Test"]   # cricket.com.au gameType; leaves out ODIs and T20Is
    team: "Australia Men"

  - name: nsw-shield
    title: NSW Blues, Sheffield Shield
    source: cricket_com_au
    discover: true
    team_id: 674     # NSW Men; the API also returns the One-Day Cup, hence game_types
    game_types: ["First Class Domestic"]   # Sheffield Shield (the One-Day Cup is "One Day Domestic")
    team: "NSW Men"

  - name: parramatta-first-grade
    title: Parramatta First Grade
    source: playhq
    team_id: bb481fee
    team: "Parramatta First Grade"
    duration_hours: 7
    url: https://www.playhq.com/cricket-australia/org/parramatta-district-cricket-club/40fec43b/nsw-premier-cricket-mens-summer-202627/teams/parramatta-first-grade/bb481fee
