# iCloud Photos backup — one icloudpd container, handling Apple accounts
# sequentially via icloudpd's native multi-account support (repeated
# --username/--directory pairs). See docs/icloud-photos-backup.md for setup.
# All identifying values are in .env.
#
# Account B is temporarily disabled: an invalid/placeholder ICLOUD_B_USERNAME
# throws an unhandled exception in pyicloud during auth (KeyError: 'dsInfo'),
# which crashes the whole icloudpd process and forces account A to restart its
# entire pass from scratch. Once ICLOUD_B_USERNAME holds a real, ready-to-auth
# Apple ID, re-add its pair to the --username/--directory list below.
#
# The Apple ID passwords are entered via the container's web UI (never
# stored in .env or the repo) and persisted only in ./data/icloudpd/cookies.

services:
  icloudpd:
    image: icloudpd/icloudpd:1.32.3
    container_name: icloudpd
    restart: unless-stopped
    # The image's own ENTRYPOINT is a dispatcher script that requires argv[0] to
    # literally be "icloud" or "icloudpd" (see /app/entrypoint.sh in the image) —
    # it errors on any other command, including a shell wrapper. Override the
    # entrypoint itself so our drive-guard script runs instead of that dispatcher.
    # The icloudpd binary lives at /app/icloudpd and is NOT on PATH, so the
    # command script below must call it by full path.
    entrypoint: ["/bin/sh", "-c"]
    networks:
      - homeserver
    environment:
      TZ: ${TIMEZONE:-UTC}
      ICLOUD_BACKUP_DRIVE_ID: ${ICLOUD_BACKUP_DRIVE_ID}
      ICLOUD_BACKUP_ROOT: ${ICLOUD_BACKUP_ROOT}
    volumes:
      # Bind the parent (/mnt), not the mount point itself, with rslave
      # propagation: a drive that drops and is remounted on the host then
      # reappears inside the container. Binding ${ICLOUD_BACKUP_ROOT} directly
      # pins the container to the stale mount until it is recreated.
      # ICLOUD_BACKUP_ROOT must live under /mnt.
      - type: bind
        source: /mnt
        target: /mnt
        bind:
          propagation: rslave
      - ./data/icloudpd/cookies:/cookies
    command:
      - |
        # Wait (re-checking every 5 min) until the right drive is mounted. The log
        # line is matched by homepage-api for the "Drive not mounted" tile.
        while [ "$$(cat "$$ICLOUD_BACKUP_ROOT/.backup-drive" 2>/dev/null)" != "$$ICLOUD_BACKUP_DRIVE_ID" ]; do
          echo "backup drive not mounted or wrong drive"; sleep 300
        done
        # Re-check every 5 min: if the drive drops out mid-run, stop writing (kill PID 1,
        # restart policy lands us back at the guard above).
        while sleep 300; do
          [ "$$(cat "$$ICLOUD_BACKUP_ROOT/.backup-drive" 2>/dev/null)" = "$$ICLOUD_BACKUP_DRIVE_ID" ] || {
            echo "backup drive disappeared mid-run"; kill 1
          }
        done &
        exec /app/icloudpd \
          --cookie-directory /cookies \
          --watch-with-interval "${ICLOUD_INTERVAL:-21600}" \
          --folder-structure "${ICLOUD_FOLDER_STRUCTURE}" \
          --password-provider webui \
          --mfa-provider webui \
          --smtp-host "${ICLOUD_SMTP_HOST}" \
          --smtp-port "${ICLOUD_SMTP_PORT:-587}" \
          --smtp-username "${ICLOUD_SMTP_USERNAME}" \
          --smtp-password "${ICLOUD_SMTP_PASSWORD}" \
          --notification-email "${ICLOUD_NOTIFICATION_EMAIL}" \
          --no-progress-bar \
          --username "${ICLOUD_A_USERNAME}" --directory "${ICLOUD_BACKUP_ROOT}/${ICLOUD_A_SUBDIR}"
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat $$ICLOUD_BACKUP_ROOT/.backup-drive 2>/dev/null)\" = \"$$ICLOUD_BACKUP_DRIVE_ID\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.icloud.rule=Host(`icloud.${DOMAIN}`)"
      - "traefik.http.routers.icloud.entrypoints=websecure"
      - "traefik.http.routers.icloud.tls=true"
      - "traefik.http.services.icloud.loadbalancer.server.port=8080"
      - "traefik.http.routers.icloud.middlewares=admin-secure"

networks:
  homeserver:
    external: true
    name: home-server-stack_homeserver
