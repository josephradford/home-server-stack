# Odd jobs: deterministic life-admin jobs (no AI). Publishes sports fixture calendars
# at https://jobs.${DOMAIN}/<name>.ics for Apple Calendar subscription, and builds the
# daily RSS-to-EPUB reading digest into the CWA ingest folder.
# Follows the conventions of docker-compose.library.yml (external homeserver network,
# Traefik labels with the wildcard cert, admin middleware).
#
# One-time prep (data/cwa/ingest must exist and be owned by PUID:PGID, otherwise Docker
# creates it as root and the digest job cannot write there):
#   mkdir -p data/odd-jobs data/cwa/ingest
#   chown -R ${PUID}:${PGID} data/odd-jobs data/cwa/ingest
# Migrating from the old library-digest container (keeps already-bundled posts from
# being re-sent):
#   mv data/library-digest/seen.json data/odd-jobs/digest-seen.json

services:
  odd-jobs:
    build: ./apps/odd-jobs
    container_name: odd-jobs
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    networks:
      - homeserver
    environment:
      TZ: ${TIMEZONE:-UTC}
      DOMAIN: ${DOMAIN}
      ODD_JOBS_RUN_AT: ${ODD_JOBS_RUN_AT:-04:00}
      ODD_JOBS_DIGEST_RUN_AT: ${ODD_JOBS_DIGEST_RUN_AT:-05:00}
    volumes:
      - ./data/odd-jobs:/data               # state.db, out/*.ics (the served calendars), digest-seen.json
      - ./config/odd-jobs:/config:ro        # calendars.yaml
      - ./config/library:/library-config:ro # feeds.txt for the reading digest
      - ./data/cwa/ingest:/ingest           # digest EPUBs; CWA imports and clears them
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odd-jobs.rule=Host(`jobs.${DOMAIN}`)"
      - "traefik.http.routers.odd-jobs.entrypoints=websecure"
      - "traefik.http.routers.odd-jobs.tls=true"
      - "traefik.http.services.odd-jobs.loadbalancer.server.port=8080"
      # Local/VPN only. Apple Calendar keeps its last fetched events when a refresh
      # fails, so being off-network only means slightly stale data.
      - "traefik.http.routers.odd-jobs.middlewares=admin-secure"

networks:
  homeserver:
    external: true
    name: home-server-stack_homeserver
