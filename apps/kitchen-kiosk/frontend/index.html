<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Kitchen Kiosk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="view-idle" class="view">
    <img id="idle-photo" src="" alt="">
    <!-- Two full-width gradient bands instead of four separate corner
         boxes - a single continuous edge reads much better against a
         photo than four independent gradient triangles, whose corners
         were visibly cut off against some photos. -->
    <div class="overlay-band overlay-top">
      <div class="overlay-section">
        <div id="overlay-time" class="overlay-clock">🕐 <span id="overlay-time-value"></span></div>
        <div id="overlay-date"></div>
      </div>
      <div id="overlay-nowplaying" class="overlay-section overlay-nowplaying hidden"></div>
      <div id="overlay-weather" class="overlay-section overlay-align-end"></div>
    </div>
    <div class="overlay-band overlay-bottom">
      <div id="overlay-photo-meta" class="overlay-section overlay-photo-meta">📷 <span id="overlay-photo-meta-value"></span></div>
      <div id="overlay-events" class="overlay-section overlay-align-end"></div>
    </div>
  </div>

  <!-- Not a full .view - this overlays on top of the idle photo (dimmed via
       CSS) rather than replacing it, so touching to navigate doesn't lose
       the screensaver. Clicking the dimmed backdrop (anywhere but a button)
       returns to idle immediately, via the listener in app.js. -->
  <div id="view-nav" class="nav-overlay hidden">
    <button data-panel="radio"><span class="nav-icon">📻</span>Radio</button>
    <button data-panel="calendar"><span class="nav-icon">📅</span>Calendar</button>
    <button data-panel="recipes"><span class="nav-icon">🍳</span>Recipes</button>
  </div>

  <div id="view-radio" class="view panel hidden">
    <button class="back-btn" onclick="event.stopPropagation(); KioskApp.showIdle()">← Back</button>
    <ul id="radio-list"></ul>
    <audio id="radio-audio"></audio>
  </div>
  <div id="view-calendar" class="view panel hidden">
    <button class="back-btn" onclick="event.stopPropagation(); KioskApp.showIdle()">← Back</button>
    <ul id="calendar-list"></ul>
  </div>
  <div id="view-recipes" class="view panel hidden">
    <button class="back-btn" onclick="event.stopPropagation(); KioskApp.showIdle()">← Back</button>
    <div id="recipes-list-view">
      <ul id="recipes-list"></ul>
    </div>
    <div id="recipes-detail-view" class="hidden">
      <button class="back-btn" id="recipes-back-to-list">← Recipes</button>
      <h1 id="recipe-title"></h1>
      <h2>Ingredients</h2>
      <ul id="recipe-ingredients"></ul>
      <h2>Steps</h2>
      <ol id="recipe-steps"></ol>
    </div>
  </div>

  <div id="view-sleep" class="view hidden"></div>

  <script src="app.js"></script>
</body>
</html>
