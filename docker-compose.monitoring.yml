services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${SERVER_IP}:9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - homeserver
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      # Using file provider certificate (wildcard from certbot)
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      # Security: VPN/Local access only - metrics database should never be public
      - "traefik.http.routers.prometheus.middlewares=admin-secure"

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    expose:
      - 3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - homeserver
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      # Using file provider certificate (wildcard from certbot)
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # Security: VPN/Local access only - monitoring dashboards should never be public
      # Note: Using admin-secure-no-ratelimit because Grafana dashboards make many API calls per panel
      - "traefik.http.routers.grafana.middlewares=admin-secure-no-ratelimit"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    # Resolve external names (smtp.gmail.com) via public DNS, not the host resolver:
    # the host uses AdGuard, so if AdGuard dies the alert email would fail too.
    # Docker's embedded DNS still handles container names.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    ports:
      - "${SERVER_IP}:9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    networks:
      - homeserver
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alerts.${DOMAIN}`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls=true"
      # Using file provider certificate (wildcard from certbot)
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
      # Security: VPN/Local access only - alert management should never be public
      - "traefik.http.routers.alertmanager.middlewares=admin-secure"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    # Scraped by Prometheus over the homeserver network; no host port published.
    # pid: host lets it see host processes (process/fork metrics).
    pid: host
    cpus: 0.25
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - homeserver
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    # Scraped by Prometheus over the homeserver network; no host port published.
    # Capped so a runaway collector can't heat the host.
    cpus: 0.5
    mem_limit: 512m
    # Collect only Docker containers, every 15s (matches the Prometheus scrape
    # interval), and skip metric groups nothing here uses. Dashboards and alerts
    # use cpu, memory, network, last_seen, start_time and spec_memory_limit.
    # `disk` matters most: with /var/lib/docker mounted it walks every container's
    # overlay layers for usage (~14% of a core and ~370MiB of kernel slab vs ~0%).
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=15s'
      - '--disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,disk,diskIO'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Docker uses the containerd snapshotter here; without this mount cAdvisor
      # logs "could not stat /var/lib/docker/rootfs/overlayfs/..." and burns CPU.
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # Not privileged (docs/security-audit-2026-04-17.md #3): the mounts above plus
    # /dev/kmsg are what cAdvisor needs.
    devices:
      - /dev/kmsg
    networks:
      - homeserver
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./monitoring/blackbox:/etc/blackbox_exporter
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    cap_add:
      - NET_RAW
    networks:
      - homeserver
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9115/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  unpoller:
    image: ghcr.io/unpoller/unpoller:v5.5.1
    container_name: unpoller
    restart: unless-stopped
    environment:
      # Verified against v5.5.1: these names authenticate with an API key.
      UP_UNIFI_DEFAULT_URL: ${UNIFI_URL:-https://192.168.1.1}
      UP_UNIFI_DEFAULT_API_KEY: ${UNIFI_API_KEY:-}
      UP_UNIFI_DEFAULT_VERIFY_SSL: "false"   # the router's certificate is self-signed
      UP_INFLUXDB_DISABLE: "true"            # Prometheus output only
    # No healthcheck: the image has no shell or wget to run one with.
    networks:
      - homeserver

volumes:
  prometheus_data:
  grafana_data:

networks:
  homeserver:
    driver: bridge